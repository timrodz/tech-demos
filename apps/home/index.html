<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tech Demos</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    
    .container {
      max-width: 800px;
      width: 100%;
      background: rgba(255, 255, 255, 0.95);
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 48px;
    }
    
    h1 {
      font-size: 2.5rem;
      color: #1a202c;
      margin-bottom: 12px;
      font-weight: 700;
    }
    
    .subtitle {
      font-size: 1.125rem;
      color: #4a5568;
      margin-bottom: 40px;
    }
    
    .demo-grid {
      display: grid;
      gap: 16px;
    }
    
    .demo-card {
      display: block;
      padding: 24px;
      background: white;
      border: 2px solid #e2e8f0;
      border-radius: 12px;
      text-decoration: none;
      transition: all 0.2s ease;
      color: inherit;
    }
    
    .demo-card:hover {
      border-color: #667eea;
      transform: translateY(-2px);
      box-shadow: 0 8px 16px rgba(102, 126, 234, 0.2);
    }
    
    .demo-card h2 {
      font-size: 1.5rem;
      color: #2d3748;
      margin-bottom: 8px;
      font-weight: 600;
    }
    
    .demo-card p {
      color: #718096;
      line-height: 1.6;
    }
    
    .demo-meta {
      margin-top: 12px;
      font-size: 0.875rem;
      color: #a0aec0;
    }
    
    footer {
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid #e2e8f0;
      text-align: center;
      color: #718096;
      font-size: 0.875rem;
    }
    
    footer a {
      color: #667eea;
      text-decoration: none;
    }
    
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>Tech Demos</h1>
    <p class="subtitle">A collection of hyper-specific technical demonstrations</p>
    
    <div class="demo-grid">
      <a href="./demo-1/" class="demo-card">
        <h2>Demo 1: WebGPU UV Gradient</h2>
        <p>Animated UV gradient shader using WebGPU and vgpu. Showcases shader fundamentals with time-based animation and wave composition to create living gradients.</p>
        <div class="demo-meta">Shipped: 2026-10-06</div>
      </a>
    </div>
    
    <footer>
      <p>View source on <a href="https://github.com/timrodz/tech-demos" target="_blank">GitHub</a></p>
    </footer>
  </div>
</body>
</html>
